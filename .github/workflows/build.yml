# Builds ChartPlayer's packages (the application and the plugin as CLAP and VST3, for Windows and Linux, and the
# Windows installer), attached to the run as artifacts. See package.yml.
name: Build

on:
  workflow_dispatch:
  # Pull requests, and pushes to master only: a push to a pull request's branch runs once, as the pull request.
  # Documentation-only changes run nothing.
  pull_request:
    paths-ignore: ['**.md']
  push:
    branches: [master]
    paths-ignore: ['**.md']

# One run per branch or pull request: a newer push cancels the run still going for the older one
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    uses: ./.github/workflows/package.yml
