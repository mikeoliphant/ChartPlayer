# Builds ChartPlayer's packages (the application and the plugin as CLAP and VST3, for Windows and Linux, and the
# Windows installer) on every push and pull request, attached to the run as artifacts. See package.yml.
name: Build

on:
  [workflow_dispatch, push, pull_request]

# A newer push to the same branch (or pull request) cancels the run still going for the older one
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    uses: ./.github/workflows/package.yml
